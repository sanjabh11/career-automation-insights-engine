name: Phase C Runtime Smoke

on:
  pull_request:
    branches:
      - main
      - live-auth-e2e-closeout
      - phase-a-truth-claims-reconciliation
      - phase-b-validation-calibration
      - phase-c-runtime-verification-bugfixes
      - phase-d-global-english-localization
      - phase-e-commercial-validation
  push:
    branches:
      - live-auth-e2e-closeout
      - phase-a-truth-claims-reconciliation
      - phase-b-validation-calibration
      - phase-c-runtime-verification-bugfixes
      - phase-d-global-english-localization
      - phase-e-commercial-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-c-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    name: Runtime smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Skill adjacency embedding smoke
        run: npm run smoke:skill-adjacency

      - name: Playwright Phase C smoke
        run: npm run e2e:smoke
