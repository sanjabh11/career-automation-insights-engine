name: Commercial Proof Pack

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - commercialization-proof-packs
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: commercial-proof-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-commercial-proof-pack:
    name: Verify commercial proof pack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify commercial proof pack
        run: npm run verify:commercial -- --with-a11y --with-journey

      - name: Verify official sources and production audit
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: npm run verify:commercial-network
