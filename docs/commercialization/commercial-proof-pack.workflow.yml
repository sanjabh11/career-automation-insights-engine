name: Commercial Proof Pack

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - commercialization-proof-packs

jobs:
  verify-commercial-proof-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify commercial proof pack
        run: npm run verify:commercial -- --with-a11y
