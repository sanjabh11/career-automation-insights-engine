<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">APO reliability curve fixture</title>
  <desc id="desc">Predicted APO estimate versus external published automation-probability anchors for the Phase B fixture.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <line x1="64" y1="456" x2="696" y2="64" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="64" y1="456" x2="696" y2="456" stroke="#0f172a" stroke-width="2"/>
  <line x1="64" y1="456" x2="64" y2="64" stroke="#0f172a" stroke-width="2"/>

  <line x1="64" y1="456" x2="64" y2="462" stroke="#0f172a"/>
  <text x="64" y="480" text-anchor="middle" font-size="12" fill="#334155">0%</text>
  <line x1="58" y1="456" x2="64" y2="456" stroke="#0f172a"/>
  <text x="52" y="460" text-anchor="end" font-size="12" fill="#334155">0%</text>
  <line x1="222" y1="456" x2="222" y2="462" stroke="#0f172a"/>
  <text x="222" y="480" text-anchor="middle" font-size="12" fill="#334155">25%</text>
  <line x1="58" y1="298" x2="64" y2="298" stroke="#0f172a"/>
  <text x="52" y="302" text-anchor="end" font-size="12" fill="#334155">25%</text>
  <line x1="380" y1="456" x2="380" y2="462" stroke="#0f172a"/>
  <text x="380" y="480" text-anchor="middle" font-size="12" fill="#334155">50%</text>
  <line x1="58" y1="140" x2="64" y2="140" stroke="#0f172a"/>
  <text x="52" y="144" text-anchor="end" font-size="12" fill="#334155">50%</text>
  <line x1="538" y1="456" x2="538" y2="462" stroke="#0f172a"/>
  <text x="538" y="480" text-anchor="middle" font-size="12" fill="#334155">75%</text>
  <line x1="58" y1="-18" x2="64" y2="-18" stroke="#0f172a"/>
  <text x="52" y="-14" text-anchor="end" font-size="12" fill="#334155">75%</text>
  <line x1="696" y1="456" x2="696" y2="462" stroke="#0f172a"/>
  <text x="696" y="480" text-anchor="middle" font-size="12" fill="#334155">100%</text>
  <line x1="58" y1="-176" x2="64" y2="-176" stroke="#0f172a"/>
  <text x="52" y="-172" text-anchor="end" font-size="12" fill="#334155">100%</text>
  <text x="380" y="504" text-anchor="middle" font-size="14" fill="#0f172a">Predicted APO decision-support estimate</text>
  <text x="18" y="260" transform="rotate(-90 18 260)" text-anchor="middle" font-size="14" fill="#0f172a">External published anchor</text>
  <polyline points="177.76,453.472 396.85333333333335,-110.69333333333327 607.52,-163.36" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="177.76" cy="453.47" r="7" fill="#2563eb" opacity="0.85"><title>0-20%, n=1</title></circle>
    <circle cx="396.85" cy="-110.69" r="11" fill="#2563eb" opacity="0.85"><title>40-60%, n=3</title></circle>
    <circle cx="607.52" cy="-163.36" r="11" fill="#2563eb" opacity="0.85"><title>80-100%, n=3</title></circle>
  <text x="64" y="36" font-size="18" font-weight="700" fill="#0f172a">Reliability fixture: predicted vs. external anchor</text>
  <text x="64" y="58" font-size="12" fill="#475569">Dashed line is perfect agreement. Points are binned averages; area is not proportional to population.</text>
</svg>
